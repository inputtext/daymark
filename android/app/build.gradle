apply plugin: 'com.android.application'

// Release signing inputs come only from the local build environment.
// Never commit a keystore, signing passwords or private key material.
def daymarkReleaseKeystore = System.getenv('DAYMARK_RELEASE_KEYSTORE')
def daymarkReleaseStorePassword = System.getenv('DAYMARK_RELEASE_STORE_PASSWORD')
def daymarkReleaseKeyAlias = System.getenv('DAYMARK_RELEASE_KEY_ALIAS')
def daymarkReleaseKeyPassword = System.getenv('DAYMARK_RELEASE_KEY_PASSWORD')
def daymarkReleaseSigningReady = [
    daymarkReleaseKeystore, daymarkReleaseStorePassword,
    daymarkReleaseKeyAlias, daymarkReleaseKeyPassword
].every { it != null && !it.trim().isEmpty() }
def daymarkVersionCode = (System.getenv('DAYMARK_VERSION_CODE') ?: '1').toInteger()
def daymarkVersionName = System.getenv('DAYMARK_VERSION_NAME') ?: '1.0'

android {
    namespace = "com.piyush.daymark"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.piyush.daymark"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode daymarkVersionCode
        versionName daymarkVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        daymarkRelease {
            if (daymarkReleaseSigningReady) {
                storeFile file(daymarkReleaseKeystore)
                storePassword daymarkReleaseStorePassword
                keyAlias daymarkReleaseKeyAlias
                keyPassword daymarkReleaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (daymarkReleaseSigningReady) {
                signingConfig signingConfigs.daymarkRelease
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Never treat an unsigned APK as a distributable Daymark release.
// CI's normal assembleDebug and local Android Studio debug builds are unaffected.
gradle.taskGraph.whenReady { graph ->
    if ((graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease'))
            && !daymarkReleaseSigningReady) {
        throw new GradleException(
            'Release signing is not configured. Use scripts/build-signed-apk.ps1 ' +
            'with a private, locally stored keystore and signing credentials.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
